<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Dennis Munene, P.E.</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="script.js"></script>
</head>
<body>
  <!-- Header / Navigation -->
  <header id="site-header"></header>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="container">
      <h2>Get In Touch</h2>
      <div class="contact-content">

        <!-- Contact Info -->
        <div class="contact-info">
          <h3>Contact Information</h3>
          <p><i class="fas fa-envelope"></i> <strong>Email:</strong> atconltdinfo@gmail.com</p>
          <p><i class="fas fa-phone"></i> <strong>Phone:</strong> 0798806154 <b>/</b>
            0101883371</p>
          <p><i class="fas fa-map-marker-alt"></i> <strong>Serving:</strong> Nairobi Kenya</p>

          <h3>Follow My Work</h3>
          <div class="social-icons">
            <a href="#"><i class="fab fa-linkedin"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook"></i></a>
          </div>
        </div>

        <!-- Contact Form -->
        <form id="contactForm" action="mailto:atconltdinfo@gmail.com" method="post" enctype="text/plain">
          <div class="form-group">
              <input type="text" name="name" placeholder="Your Name" required>
          </div>
        
          <div class="form-group">
              <input type="email" name="email" placeholder="Your Email" required>
          </div>
        
          <div class="form-group">
              <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          </div>
        
          <button type="submit" class="btn">Send Message</button>
        </form>
        
        

      </div>
    </div>
  </section>

  <!-- Optional: Google Maps Embed -->
  <section class="map-section">
    <div class="container">
      <h3>Service Area</h3>
      <!-- Replace with real embed link later -->
      <iframe
        src="https://www.google.com/maps?q=Simba+Centre+Nairobi&output=embed"
        width="100%"
        height="300"
        style="border:0; border-radius: 10px;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </section>

  <a href="https://wa.me/254798806154"
   class="whatsapp-float"
   target="_blank">
   <i class="fab fa-whatsapp"></i>
</a>
  <!-- Footer -->
    <footer id="site-footer"></footer>
